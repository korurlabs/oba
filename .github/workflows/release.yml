name: Release

# Publishes one Oba release from a tag vX.Y.Z (or vX.Y.Z-rc.N):
#   - seven images, ghcr.io/korurlabs/oba-<component>:X.Y.Z, plus :latest on a stable version
#   - the Helm chart, oci://ghcr.io/korurlabs/charts/oba version X.Y.Z, whose appVersion and
#     image tags are the same X.Y.Z
#   - the Artifact Hub metadata, on the same OCI repository under the tag artifacthub.io
#   - a GitHub release with the chart package
#
# The chart is pushed only after every image is, so no chart version names a missing image.
# Each image is scanned before it is pushed, and an image with a CRITICAL or HIGH vulnerability
# that has a fixed version is never pushed, unless .trivyignore.yaml accepts that vulnerability
# until a set date. The images build in parallel, so when one fails its
# scan, images that already passed theirs may be on ghcr.io under X.Y.Z (and :latest on a
# stable version); the matrix then cancels the images still building, and the chart, the
# Artifact Hub metadata and the GitHub release are not published, so no chart or release names
# the version.
# The only credential is GITHUB_TOKEN. Images build on the public base images that the
# Dockerfiles name.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/korurlabs
  CHART_DIR: charts/oba
  CHART_OCI_REF: ghcr.io/korurlabs/charts/oba
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Derive the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag '$TAG' is not vX.Y.Z or vX.Y.Z-<prerelease>."
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            kind: backend
          - name: kazan
            kind: frontend
          - name: kaya
            kind: frontend
          - name: kalkan
            kind: frontend
          - name: otak
            kind: frontend
          - name: ulak
            kind: frontend
          - name: account
            kind: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        if: matrix.kind == 'backend'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # The Dockerfile copies target/*.jar; the Backend workflow has already tested this commit.
      - name: Package the API
        if: matrix.kind == 'backend'
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Set up Node.js
        if: matrix.kind == 'frontend'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Set up Bun
        if: matrix.kind == 'frontend'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Install dependencies
        if: matrix.kind == 'frontend'
        working-directory: frontend
        run: bun install --frozen-lockfile

      # The Dockerfile copies apps/<app>/.next. The build reads no secret: the apps read their
      # URLs and sign-in settings at run time.
      - name: Build the app
        if: matrix.kind == 'frontend'
        working-directory: frontend
        env:
          APP: ${{ matrix.name }}
        run: bun turbo build --filter="${APP}..."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A release never publishes an image with a CRITICAL or HIGH vulnerability that has a
      # fixed version, except one that .trivyignore.yaml accepts until a set date, with its
      # reason. The image is first built into the local Docker daemon, scanned there,
      # and pushed only if the scan passes. The build and the scan run before the registry
      # login, so the scanner never runs while a credential that can push packages is on
      # disk. The push step below keeps its inputs unchanged and runs on the same builder, so
      # every layer comes from the build cache: the image pushed is the image scanned, with
      # the provenance the push has always attached.
      - name: Build the image for the vulnerability scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.kind }}
          file: ${{ matrix.kind }}/Dockerfile
          platforms: linux/amd64
          build-args: ${{ matrix.kind == 'frontend' && format('APP_NAME={0}', matrix.name) || '' }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/oba-${{ matrix.name }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      # The vulnerability database is rebuilt every few hours; the copy the Trivy workflow saves
      # on main once a day keeps the download off most runs. A release only restores it, so it
      # adds no cache entry of its own.
      - name: Date for the Trivy cache key
        id: trivy-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the Trivy database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-

      # trivy-action had its version tags hijacked on 2026-03-19 (GHSA-69fq-xp46-6x23): it is
      # pinned to the commit of 0.35.0, which Aqua states was not affected, and the binary to
      # a fixed version published after the incident. Never move either to a tag or `latest`.
      - name: Scan the image for fixable CRITICAL and HIGH vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.2
          # The database is cached by the step above.
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/oba-${{ matrix.name }}:${{ needs.version.outputs.version }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Trivy loads a YAML ignore file only when it is named; the path is relative to the
          # checkout.
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: '1'

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose the image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/oba-${{ matrix.name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            if [ "$PRERELEASE" != true ]; then
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # amd64 only, as the images Oba has always run on.
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.kind }}
          file: ${{ matrix.kind }}/Dockerfile
          platforms: linux/amd64
          build-args: ${{ matrix.kind == 'frontend' && format('APP_NAME={0}', matrix.name) || '' }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only

  publish:
    name: Chart and GitHub release
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0

      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.1

      # helm package sets version and appVersion; the Artifact Hub annotations are plain text,
      # so the image tags and the prerelease flag are written here.
      - name: Stamp the chart annotations
        run: |
          chart="$CHART_DIR/Chart.yaml"
          sed -E -i "s#(image: ghcr\.io/korurlabs/oba-[a-z]+):.*#\1:${VERSION}#" "$chart"
          sed -E -i "s#(artifacthub\.io/prerelease:).*#\1 \"${PRERELEASE}\"#" "$chart"
          count=$(grep -c "image: ghcr.io/korurlabs/oba-[a-z]*:${VERSION}$" "$chart")
          if [ "$count" -ne 7 ]; then
            echo "::error::Expected 7 image entries tagged $VERSION in $chart, found $count."
            exit 1
          fi

      - name: Lint and package the chart
        run: |
          helm lint "$CHART_DIR"
          mkdir -p "$RUNNER_TEMP/chart"
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP/chart"

      - name: Push the chart to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/oba-$VERSION.tgz" "oci://${CHART_OCI_REF%/oba}"

      # Artifact Hub reads repository metadata of an OCI chart from the tag artifacthub.io of
      # the chart's own repository, with these media types:
      # https://artifacthub.io/docs/topics/repositories/helm-charts/#oci-support
      - name: Push the Artifact Hub metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin
          cd charts
          oras push "$CHART_OCI_REF:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          \`\`\`sh
          helm install oba oci://$CHART_OCI_REF --version $VERSION -f my-values.yaml
          \`\`\`

          Images: \`$REGISTRY/oba-<component>:$VERSION\` for \`api\`, \`kazan\`, \`kaya\`, \`kalkan\`, \`otak\`, \`ulak\`, \`account\`.
          EOF
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Oba $VERSION"
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "$RUNNER_TEMP/chart/oba-$VERSION.tgz" "${args[@]}"
