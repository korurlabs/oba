name: Frontend

# Installs the Bun workspace from its lockfile, builds every app and package, then runs the type
# check and the tests of each workspace that defines them. The build reads no secret: the apps
# read their URLs and sign-in settings at run time. It publishes nothing.
#
# Fork safety: `pull_request` only (never `pull_request_target` or `workflow_run`), so a run from a
# fork gets a read-only token and no secret.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/**/kagi.yaml'
      - '!**/*.md'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/**/kagi.yaml'
      - '!**/*.md'
      - '.github/workflows/frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Next.js, Expo and ESLint run on Node.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Pinned to the workspace's packageManager, so the lockfile behaves as it does locally.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      # Saved on main only: a cache written on a pull request is readable by that pull request
      # alone.
      - name: Restore the Bun cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Save the Bun cache
        if: github.ref_name == 'main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun turbo run typecheck

      - name: Test
        run: bun turbo run test
