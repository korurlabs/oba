name: Backend

# Builds the Oba API and runs every unit test (surefire, *Test) and every integration test
# (failsafe, *IT). The integration tests start the whole application against PostgreSQL and
# Azurite from backend/docker-compose.ci.yaml, so Flyway migrates a real database and Hibernate
# validates the entities against it. The job reads no secret: the values without a default are
# generated or fixed in the test step. It publishes nothing.
#
# Fork safety: `pull_request` only (never `pull_request_target` or `workflow_run`), so a run from a
# fork gets a read-only token and no secret.
# A `merge_group` run starts only for a pull request that was approved and queued.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      # Backend unit tests read the Kaya recorded runs through ../frontend.
      - 'frontend/apps/kaya/fixtures/**'
      - '!backend/kagi.yaml'
      - '!**/*.md'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/apps/kaya/fixtures/**'
      - '!backend/kagi.yaml'
      - '!**/*.md'
      - '.github/workflows/backend.yml'
  # merge_group takes no paths filter, so the queue runs this workflow for every
  # candidate and never waits on a check that was skipped.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            backend
            frontend/apps/kaya/fixtures

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Start PostgreSQL and Azurite
        # The init container exits once it has created the blob containers, which --wait would
        # report as a failure, so it runs on its own after the two services are healthy.
        run: |
          docker compose -f docker-compose.ci.yaml up -d --wait --wait-timeout 120 postgres azurite
          docker compose -f docker-compose.ci.yaml run --rm azurite-init

      - name: Unit and integration tests
        env:
          # The test profile lets the application sign with a key it generates at startup, which
          # it refuses in any other profile, so no signing key has to be supplied.
          SPRING_PROFILES_ACTIVE: test
          # The blob endpoint of the compose Azurite. The application refuses to start without a
          # blob base URL.
          AZURE_STORAGE_BLOB_BASE_URL: http://127.0.0.1:10000/devstoreaccount1
        run: |
          # The application refuses to start without an encryption secret. A new random one per
          # run is enough: the tests only decrypt what they encrypted in the same run.
          ENCRYPTION_SECRET="$(openssl rand -hex 32)"
          export ENCRYPTION_SECRET
          mvn -B clean verify -Djacoco.skip=true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports-${{ github.run_attempt }}
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop PostgreSQL and Azurite
        if: always()
        run: docker compose -f docker-compose.ci.yaml down -v --remove-orphans
