name: CodeQL

# Static analysis of the source code for security flaws (injection, unsafe
# deserialization, path traversal, leaked tokens in workflows and so on). The
# results appear under the repository's Security tab, and a pull request shows
# the new alerts it introduces. CodeQL is free on a public repository.
#
# It runs on every pull request and push to main, so a flaw is found before it
# merges, and weekly, so code that did not change is checked against the new
# queries GitHub adds.
#
# Languages: java-kotlin (backend), go (cli/oba),
# javascript-typescript (frontend) and actions (the workflows themselves).
# Java, TypeScript and the workflows are analysed from source without a build;
# Go is analysed while CodeQL builds it, which is the only mode it supports.
#
# Merge queue: `merge_group` scans each queued merge commit, which combines the
# pull requests ahead of it in the queue, before it lands. GitHub's code
# scanning merge protection does not apply to merge queue groups, so a finding
# there does not stop the queue; the pull request stays the gate.
#
# Fork safety: `pull_request` only (never `pull_request_target`), so a run from
# a fork gets a read-only token and no secret.
# A `merge_group` run starts only for a pull request that was approved and queued.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Uploads the results to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The query suite (security-and-quality) and the quality queries
          # left out of it, each with its reason, are in the config file.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
