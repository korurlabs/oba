{{- range $name := splitList " " (include "oba.components" .) }}
{{- $c := index $.Values $name }}
{{- $ctx := dict "root" $ "name" $name }}
{{- if and $c.enabled $c.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oba.componentName" $ctx }}
  labels:
    {{- include "oba.labels" $ctx | nindent 4 }}
  {{- with $c.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No component calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
{{- end }}
