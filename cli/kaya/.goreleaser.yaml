version: 2

# The Kaya CLI source lives in this PRIVATE monorepo, but its releases are
# published to the PUBLIC korurlabs/kaya-cli repo, because
# `brew install korurlabs/tap/kaya-cli` resolves release assets from there
# and Homebrew cannot authenticate against a private repo.
#
# Do NOT change project_name: it determines both the tap formula filename
# (Formula/kaya-cli.rb) and every archive name
# (kaya-cli_<version>_<os>_<arch>.tar.gz). The binary inside is `kaya`.
project_name: kaya-cli

before:
  hooks:
    # A release must trust the production signing key: with the compiled-in key
    # map empty, every developer machine would refuse every config release. This
    # test fails the release instead.
    - go test -tags release -run TestReleaseTrustsAKey ./internal/delivery/

builds:
  - id: kaya
    main: .
    binary: kaya
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    # -s -w drop the symbol table and DWARF, but Go still embeds build-machine
    # absolute source paths in the pcln table so panic traces can name a file.
    # -trimpath keeps the runner's directory layout out of stack traces and makes
    # the build reproducible.
    flags:
      - -trimpath

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

brews:
  - repository:
      owner: korurlabs
      name: homebrew-tap
      # The short-lived `sensey-releases` GitHub App installation token the
      # release workflow mints, scoped to the release repo and the tap.
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: sensey-releases[bot]
      email: 327959077+sensey-releases[bot]@users.noreply.github.com
    homepage: "https://github.com/korurlabs/kaya-cli"
    description: "Kaya CLI: signed agent config of Claude Code from Kaya"
    # kaya-launch is the same binary; the VS Code extension starts Claude Code
    # through it (claudeCode.claudeProcessWrapper, set by `kaya install`).
    install: |
      bin.install "kaya"
      bin.install_symlink "kaya" => "kaya-launch"
    test: |
      system "#{bin}/kaya", "--version"
    # Rehearsal tags (e.g. v1.2.0-rc.1) must NOT reach the tap: brew has no
    # prerelease channel, so a formula commit would upgrade everyone to it.
    skip_upload: auto

# Cut the release in the PUBLIC repo, not this private one: goreleaser uses
# release.github for the release, every asset upload and the formula URLs.
# target_commitish stays unset, so GitHub creates the tag on that repo's own
# default branch; this monorepo's SHA would answer 422 there.
release:
  github: { owner: korurlabs, name: kaya-cli }
  mode: keep-existing
  prerelease: auto
  extra_files:
    - glob: ./install.sh

# SECURITY: release notes are supplied explicitly via --release-notes, generated
# path-scoped to this directory. This exclude-all filter is the backstop for a
# hand-run goreleaser, which would otherwise resolve a previous tag from THIS
# monorepo and publish private commit messages of every project into a PUBLIC
# release body. Do NOT swap it for `disable: true`: that also drops
# --release-notes.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^.*$"
