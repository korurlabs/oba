tasks:
  frontend-install:
    on: up
    path: frontend
    run: [bun, install]
    inputs: [frontend/bun.lock]
  flyway-verify:
    on: up
    after: [backend]
    container: postgres
    run:
      - sh
      - -c
      - 'test "$(psql -U oba -d oba -tAc "SELECT COUNT(*) FROM flyway_schema_history WHERE success")" -gt 0'
  seed-dev-data:
    on: up
    after: [flyway-verify]
    container: postgres
    stdin: scripts/seed-dev-data.sql
    run:
      - sh
      - -c
      - 'if [ "$(psql -U oba -d oba -tAc "SELECT COUNT(*) FROM shrine.users")" -gt 0 ]; then echo "users exist, skipping seed"; else psql -v ON_ERROR_STOP=1 -U oba -d oba; fi'
  link-users-to-org:
    on: up
    after: [seed-dev-data]
    # A fresh database has no users to link, and the backend links them on first
    # login (projects/oba/scripts/start.sh:658-681).
    critical: false
    container: postgres
    run:
      - psql
      - -U
      - oba
      - -d
      - oba
      - -q
      - -c
      - |
        UPDATE shrine.users
        SET default_organization_id = 'b0000000-0000-0000-0000-000000000001'
        WHERE default_organization_id IS NULL;

        INSERT INTO shrine.organization_members (id, organization_id, user_id, role, status)
        SELECT gen_random_uuid(), 'b0000000-0000-0000-0000-000000000001', u.id, 'OWNER', 'ACTIVE'
        FROM shrine.users u
        WHERE NOT EXISTS (
            SELECT 1 FROM shrine.organization_members om
            WHERE om.user_id = u.id AND om.organization_id = 'b0000000-0000-0000-0000-000000000001'
        );

doctor:
  legacy:
    # The start scripts' compose project, under its current name and under the
    # name it had before the platform became Oba.
    containers: [oba-postgres, oba-keycloak, oba-azurite, oba-azurite-init, village-postgres, village-keycloak, village-azurite, village-azurite-init]
    compose-projects: [oba, village]
    ports: [5438, 8086, 10000, 8080, 3000, 3002]
