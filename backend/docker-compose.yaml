name: oba

services:
  postgres:
    image: postgres:16-alpine
    container_name: oba-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5438:5432"
    environment:
      POSTGRES_DB: oba
      POSTGRES_USER: oba
      POSTGRES_PASSWORD: oba
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/podman/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oba -d oba"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: oba-keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: oba
      KC_DB_PASSWORD: oba
      KEYCLOAK_ADMIN: senseyadmin
      KEYCLOAK_ADMIN_PASSWORD: securepassword123
    volumes:
      - ./src/main/resources/podman/keycloak/realm:/opt/keycloak/data/import:ro,z
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
      - --hostname-strict=false

  azurite:
    container_name: oba-azurite
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"
    ports:
      - "127.0.0.1:10000:10000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 10s
      timeout: 5s
      retries: 10

  azurite-init:
    container_name: oba-azurite-init
    image: mcr.microsoft.com/azure-cli:latest
    depends_on:
      azurite:
        condition: service_healthy
    volumes:
      - ./src/main/resources/podman/azurite/init:/init:ro,z
    entrypoint: ["sh", "/init/create-containers.sh"]
    restart: "no"

volumes:
  postgres_data:
