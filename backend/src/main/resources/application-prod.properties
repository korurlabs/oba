# Production profile — INFO + WARN + ERROR only
logging.level.com.korur.oba=INFO

# ── Per-environment endpoints ───────────────────────────────────────────────
# Still sourced from the Kagi vault: the production values are not recorded in
# this repository. Inline them here (and drop the vault keys) once confirmed.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER}
oba.openapi.url=${OPENAPI_URL}

# Kaya release signing key, injected by kagi-init. No defaults: an ephemeral key in production
# would sign releases no Kaya CLI trusts, so a missing value stops the startup.
kaya.config.signing.private-key=${CONFIG_SIGNING_KEY}
kaya.config.signing.key-id=${CONFIG_SIGNING_KEY_ID}
