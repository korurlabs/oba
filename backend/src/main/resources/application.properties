spring.application.name=oba-api

# Profile resolution. This MUST come from a plain environment variable: Spring
# resolves spring.profiles.active while loading THIS file, before any
# application-{profile}.properties is read, so a value defined in a
# profile-specific file could never activate that same file. Kubernetes sets
# SPRING_PROFILES_ACTIVE=prod on the Deployment; local runs fall back to
# "local", which has no properties file and therefore leaves the defaults below
# in force.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=8080

# The browser sends every cookie of the API host on the /ws handshake, unlike the
# Axios requests, which carry none. On localhost that is every local app's
# cookies (cookies ignore the port), including the chunked NextAuth session
# cookies, which exceed Tomcat's 8 KB default and turn the handshake into a 400.
server.max-http-request-header-size=64KB

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/oba}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:oba}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oba}

# Hikary Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1

spring.jackson.mapper.accept-case-insensitive-enums=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.flyway.enabled=true
spring.flyway.ignore-migration-patterns=*:missing

# ── Keycloak ────────────────────────────────────────────────────────────────
# Local defaults. Overridden per environment in application-prod.properties.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8086/realms/sensey

encryption.secret=${ENCRYPTION_SECRET}

oba.openapi.url=http://localhost:8080

# Adds http://localhost:* and http://*.localhost:* to the CORS allowlist for local development.
# Startup fails when it is true under the prod profile.
sensey.cors.allow-local-origins=${SENSEY_CORS_ALLOW_LOCAL_ORIGINS:false}

management.endpoints.web.exposure.include=health,info

# -- Realtime (STOMP over WebSocket at /ws) --
# false leaves /ws unregistered; clients then fall back to REST reads.
oba.realtime.enabled=true
# simple is the in-memory broker of one replica, the only one built; any other value stops startup.
oba.realtime.broker=simple
oba.realtime.heartbeat-ms=25000
oba.realtime.expiry-sweep-ms=30000
oba.realtime.typing-min-interval-ms=3000
# Per session: at most inbound-send-max SEND frames per window, at most max-subscriptions-per-session subscriptions.
oba.realtime.inbound-send-max=20
oba.realtime.inbound-send-window-ms=10000
oba.realtime.max-subscriptions-per-session=50

# -- Chat send rate: at most max messages per user in a sliding window --
oba.chat.send-rate.max=5
oba.chat.send-rate.window-ms=5000

# -- Intelligence Layer: Use-Case Routing --
intelligence.routing.conversation=GEMINI
intelligence.routing.scan-analysis=DEEPSEEK
intelligence.routing.threat-analysis=MISTRAL
intelligence.routing.task-generation=ANTHROPIC
intelligence.routing.ticket-analysis=ANTHROPIC

# -- Spring AI: Anthropic (Claude) --
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-configured}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5
spring.ai.anthropic.chat.options.max-tokens=4096

# -- Spring AI: Deepseek --
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:not-configured}
spring.ai.deepseek.chat.options.model=deepseek-chat

# -- Spring AI: Mistral --
spring.ai.mistralai.api-key=${MISTRAL_API_KEY:not-configured}
spring.ai.mistralai.chat.options.model=mistral-small-latest

# -- Intelligence Layer: Google Gemini (OpenAI-compat) --
intelligence.gemini.api-key=${GEMINI_API_KEY:not-configured}
intelligence.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
intelligence.gemini.model=gemini-2.5-flash
intelligence.gemini.max-tokens=8192

# -- Intelligence Layer: Grok / xAI (OpenAI-compat) --
intelligence.grok.api-key=${GROK_API_KEY:not-configured}
intelligence.grok.base-url=https://api.x.ai/v1
intelligence.grok.model=grok-2
intelligence.grok.max-tokens=2048

# -- Spring AI: OpenAI (pulled in by Grok/xAI compat dependency) --
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}

# -- Integrations: Alertmanager webhook --
# Bearer token Alertmanager sends; empty refuses every webhook call.
oba.integrations.alertmanager.token=${KAZAN_ALERTMANAGER_WEBHOOK_TOKEN:}
# Organization whose alert routes and boards receive the alerts; required when the token is set.
oba.integrations.alertmanager.organization-id=${KAZAN_ALERTMANAGER_ORGANIZATION_ID:}

# -- Integrations: GitHub App (pull request sharing; read-only, outbound only) --
# Any blank key disables the feature. The private key is the base64 of the App's PKCS#8 PEM.
# Only the organization named here may use the installation.
oba.integrations.github.app-id=${KAZAN_GITHUB_APP_ID:}
oba.integrations.github.installation-id=${KAZAN_GITHUB_INSTALLATION_ID:}
oba.integrations.github.private-key=${KAZAN_GITHUB_PRIVATE_KEY:}
oba.integrations.github.organization-id=${KAZAN_GITHUB_ORGANIZATION_ID:}

# -- Integrations: Expo Push Service (Kazan mobile push notifications; outbound only) --
# Access token of the Expo project; a blank token disables push sending.
oba.integrations.expo.access-token=${KAZAN_EXPO_ACCESS_TOKEN:}

# -- Integrations: Anthropic routines (fires a Claude Code routine of a ROUTINE agent; outbound only) --
# Each routine carries its own fire secret, stored encrypted per agent; there is no application key.
# Off by default: while false every fire is recorded as FAILED and Anthropic is not called.
oba.integrations.routine.anthropic.enabled=${OBA_ROUTINE_ANTHROPIC_ENABLED:false}
oba.integrations.routine.anthropic.base-url=https://api.anthropic.com
oba.integrations.routine.anthropic.beta-header=experimental-cc-routine-2026-04-01
oba.integrations.routine.anthropic.version=2023-06-01
oba.integrations.routine.anthropic.connect-timeout=5s
oba.integrations.routine.anthropic.read-timeout=10s

sensey.notification.default-sender=noreply@korur.com
sensey.logo.url=https://korur.com/assets/logo-korur-transparent.png

# -- Servlet multipart limits (must exceed scan max-file-size-bytes so the validator returns the typed 400) --
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1}
azure.storage.containers.default=${AZURE_STORAGE_CONTAINER_DEFAULT:dev-container}
azure.storage.default-container=default
azure.storage.sas-ttl-minutes=30
azure.storage.blob-base-url=${AZURE_STORAGE_BLOB_BASE_URL:}

microsoft.client.id=${MS_GRAPH_CLIENT_ID:placeholder}
microsoft.client.secret=${MS_GRAPH_CLIENT_SECRET:placeholder}
microsoft.tenant.id=${MS_GRAPH_TENANT_ID:placeholder}
microsoft.scope=https://graph.microsoft.com/.default

# -- Kaya: session retention and live stream --
# Deletes, once a day, the sessions past their organization's retention (UTC).
kaya.session.retention.cron=${KAYA_SESSION_RETENTION_CRON:0 30 3 * * *}
# A live session stream closes after the timeout and the client opens a new one; the heartbeat
# keeps idle streams open through proxies.
kaya.session.stream.timeout=PT1H
kaya.session.stream.heartbeat=PT25S

# -- Kaya: release signing (Ed25519) --
# The private key is PKCS#8, base64 DER or PEM; the key id names it in every signature, at most
# 40 characters. Both are required: only the test profile signs with an ephemeral key generated at
# startup when they are blank. During a rotation the previous public key (raw 32 bytes, base64)
# stays trusted until its end.
kaya.config.signing.private-key=${CONFIG_SIGNING_KEY:}
kaya.config.signing.key-id=${CONFIG_SIGNING_KEY_ID:}
kaya.config.signing.valid-from=${CONFIG_SIGNING_KEY_VALID_FROM:}
kaya.config.signing.previous-public-key=${CONFIG_SIGNING_PREVIOUS_PUBLIC_KEY:}
kaya.config.signing.previous-key-id=${CONFIG_SIGNING_PREVIOUS_KEY_ID:}
kaya.config.signing.previous-valid-to=${CONFIG_SIGNING_PREVIOUS_VALID_TO:}

# -- Kazan: repeating sprints --
# Cron (UTC) of the job that rolls repeating sprints over. Set to "0 * * * * *" to run it every minute when testing by hand.
scheduling.sprint-recurrence.cron=0 0,15,30,45 0 * * *
